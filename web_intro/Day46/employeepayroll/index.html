<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Payroll App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Employee Payroll Management System</h1>
        </header>

        <div class="main-content">
            <!-- Form Section -->
            <section class="form-section">
                <h2>Add/Edit Employee</h2>
                <form id="employeeForm">
                    <div class="form-group">
                        <label for="empName">Employee Name:</label>
                        <input type="text" id="empName" required>
                    </div>

                    <div class="form-group">
                        <label for="empId">Employee ID:</label>
                        <input type="text" id="empId" required>
                    </div>

                    <div class="form-group">
                        <label for="department">Department:</label>
                        <input type="text" id="department" required>
                    </div>

                    <div class="form-group">
                        <label for="baseSalary">Base Salary:</label>
                        <input type="number" id="baseSalary" required step="0.01">
                    </div>

                    <div class="form-group">
                        <label for="deductions">Deductions:</label>
                        <input type="number" id="deductions" step="0.01" value="0">
                    </div>

                    <div class="form-group">
                        <label for="bonus">Bonus:</label>
                        <input type="number" id="bonus" step="0.01" value="0">
                    </div>

                    <div class="form-group">
                        <label for="joiningDate">Joining Date:</label>
                        <input type="date" id="joiningDate" required>
                    </div>

                    <div class="button-group">
                        <button type="submit" id="submitBtn">Add Employee</button>
                        <button type="reset" id="resetBtn">Clear</button>
                    </div>
                </form>
            </section>

            <!-- Display Section -->
            <section class="display-section">
                <h2>Employee List</h2>
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Search by name or ID...">
                </div>
                <div id="employeeContainer" class="employee-container">
                    <p class="no-data">No employees added yet.</p>
                </div>
            </section>
        </div>
    </div>

    <!-- Modal for Editing -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Edit Employee</h2>
            <form id="editForm">
                <div class="form-group">
                    <label for="editName">Employee Name:</label>
                    <input type="text" id="editName" required>
                </div>
                <div class="form-group">
                    <label for="editDepartment">Department:</label>
                    <input type="text" id="editDepartment" required>
                </div>
                <div class="form-group">
                    <label for="editBaseSalary">Base Salary:</label>
                    <input type="number" id="editBaseSalary" required step="0.01">
                </div>
                <div class="form-group">
                    <label for="editDeductions">Deductions:</label>
                    <input type="number" id="editDeductions" step="0.01">
                </div>
                <div class="form-group">
                    <label for="editBonus">Bonus:</label>
                    <input type="number" id="editBonus" step="0.01">
                </div>
                <div class="form-group">
                    <label for="editJoiningDate">Joining Date:</label>
                    <input type="date" id="editJoiningDate" required>
                </div>
                <div class="button-group">
                    <button type="submit">Update Employee</button>
                    <button type="button" id="cancelBtn">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
