<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Payroll App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h2>Employee Payroll Form</h2>

        <!-- Name -->
        <div class="form-group">
            <label>Name</label>
            <input type="text" id="name">
            <span class="error" id="nameError"></span>
        </div>

        <!-- Salary -->
        <div class="form-group">
            <label>Salary</label>

            <input
                type="range"
                id="salary"
                min="10000"
                max="100000"
                step="1000"
                value="40000">

            <output id="salaryOutput">40000</output>
        </div>

        <!-- Start Date -->
        <div class="form-group">
            <label>Start Date</label>
            <input type="date" id="startDate">
            <span class="error" id="dateError"></span>
        </div>
		<input type="text" id="name">
		<span id="nameError" class="error"></span>

		<input type="range" id="salary" min="10000" max="100000" value="40000">
		<output id="salaryOutput">40000</output>

		<input type="radio" name="gender" value="Male"> Male
		<input type="radio" name="gender" value="Female"> Female

		<input type="checkbox" name="department" value="HR"> HR
		<input type="checkbox" name="department" value="Sales"> Sales
		<input type="checkbox" name="department" value="Finance"> Finance

		<textarea id="notes"></textarea>

		<input type="date" id="startDate">
		<span id="dateError" class="error"></span>

		<button type="button" onclick="saveEmployee()">
		    Save
		</button>

    </div>

    <script src="script.js"></script>

</body>
</html>
