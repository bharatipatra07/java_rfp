<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Payroll App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h2>Employee Payroll Form</h2>

        <div class="form-group">
            <label>Name</label>
            <input type="text" id="name">
        </div>

        <div class="form-group">
            <label>Salary</label>
            <input type="number" id="salary">
        </div>

        <div class="form-group">
            <label>Gender</label>

            <input type="radio" name="gender" value="Male"> Male
            <input type="radio" name="gender" value="Female"> Female
        </div>

        <div class="form-group">
            <label>Department</label>

            <input type="checkbox" value="HR" class="department"> HR
            <input type="checkbox" value="Sales" class="department"> Sales
            <input type="checkbox" value="Finance" class="department"> Finance
            <input type="checkbox" value="Engineer" class="department"> Engineer
        </div>

        <div class="form-group">
            <label>Profile Picture</label>

            <select id="profilePic">
                <option value="Profile1.png">Profile1</option>
                <option value="Profile2.png">Profile2</option>
                <option value="Profile3.png">Profile3</option>
            </select>
        </div>

        <div class="form-group">
            <label>Notes</label>
            <textarea id="notes"></textarea>
        </div>

        <button onclick="saveEmployee()">Save Employee</button>

        <h3>Employee Details</h3>

        <pre id="output"></pre>

    </div>

    <script src="script.js"></script>

</body>
</html>
