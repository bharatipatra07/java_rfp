<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Payroll App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h2>Employee Payroll Form</h2>

        <div class="form-group">
            <label>Name</label>
            <input type="text" id="name">
            <span id="nameError" class="error"></span>
        </div>

        <div class="form-group">
            <label>Salary</label>
            <input type="range"
                   id="salary"
                   min="10000"
                   max="100000"
                   step="1000"
                   value="40000">
            <output id="salaryOutput">40000</output>
        </div>

        <div class="form-group">
            <label>Gender</label>

            <input type="radio" name="gender" value="Male"> Male
            <input type="radio" name="gender" value="Female"> Female
        </div>

        <div class="form-group">
            <label>Department</label>

            <input type="checkbox" name="department" value="HR"> HR
            <input type="checkbox" name="department" value="Sales"> Sales
            <input type="checkbox" name="department" value="Finance"> Finance
            <input type="checkbox" name="department" value="Engineering"> Engineering
        </div>

        <div class="form-group">
            <label>Notes</label>
            <textarea id="notes"></textarea>
        </div>

        <div class="form-group">
            <label>Start Date</label>
            <input type="date" id="startDate">
            <span id="dateError" class="error"></span>
        </div>

        <button onclick="saveEmployee()">
            Save Employee
        </button>

        <h3>Saved Employees</h3>
        <div id="employeeList"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>
